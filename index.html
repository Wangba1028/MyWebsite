
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試測試工業 | 專業製造</title>

    <style>
        body {
            margin: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            color: #263445;
            background: #f5f7fa;
        }

        header {
            background: #102b46;
            color: white;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            background: linear-gradient(120deg, #153b5c, #327ca2);
            color: white;
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 42px;
            color: red;
        }

        .hero p {
            font-size: 19px;
        }

        .button {
            display: inline-block;
            background: #f0a83c;
            color: #102b46;
            padding: 14px 28px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }

        section {
            padding: 55px 8%;
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 220px;
            box-shadow: 0 3px 12px #00000010;
        }

        .product .emoji {
            font-size: 55px;
        }

        .about {
            background: white;
        }

        footer {
            background: #102b46;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>我的第一個企業網站</h2>

        <nav>
            <a href="#about">公司介紹</a>
            <a href="#products">產品服務</a>
            <a href="#contact">聯絡我們</a>
        </nav>
    </header>

    <div class="hero">
        <h1>專業製造・品質領先</h1>
        <p>提供高品質精密加工與工業設備解決方案</p>
        <a href="#contact" class="button">聯絡我們</a>
    </div>

    <section id="about" class="about">
        <h2>關於我們</h2>
         <img src="images/factory.jpg" alt="工廠照片">
        <p>
            測試工業成立多年，專注於精密加工、
            測試工業
            工業設備及客製化製造服務。
        </p>
        <p>
            我們以專業技術、穩定品質及客戶滿意為核心價值。
        </p>
    </section>

    <section id="products">
        <h2>我們的產品</h2>

        <div class="products">

            <div class="product">
                <div class="emoji">⚙️</div>
                <h3>精密零件</h3>
                <p>高精度金屬加工零件</p>
            </div>

            <div class="product">
                <div class="emoji">🏭</div>
                <h3>工業設備</h3>
                <p>專業工業設備製造</p>
            </div>

            <div class="product">
                <div class="emoji">🔧</div>
                <h3>客製化加工</h3>
                <p>依客戶需求提供解決方案</p>
            </div>

        </div>
    </section>

    <section id="contact" class="about">
        <h2>聯絡我們</h2>
        <p>歡迎與我們聯繫，了解更多產品資訊。</p>
        <p>Email：service@example.com</p>
        <button class="button" onclick="showMessage()">
            點擊聯絡
        </button>
    </section>

    <footer>
        © 2026 測試工業 All Rights Reserved.
    </footer>

    <script>
        function showMessage() {
            alert("感謝您的聯絡！我們將盡快與您聯繫。");
        }
    </script>

</body>
</html>
